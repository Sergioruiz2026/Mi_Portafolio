    <script>
      (() => {
        try {
          const storedTheme = window.localStorage.getItem("theme");
          const theme = storedTheme === "dark" ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
